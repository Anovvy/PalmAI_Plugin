name: Publish Versioned PalmAI Inference Images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release Version Tag (e.g., v2.0.0)"
        required: true
        default: "v2.0.0"

permissions:
  contents: read
  packages: write

jobs:
  pre-publish-checks:
    name: Pre-Publish Verification Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Core & Geospatial Tests
        run: |
          python -m pytest -v tests/

  publish-images:
    name: Build & Push Images to GHCR
    needs: [pre-publish-checks]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [cpu, gpu]
    steps:
      - uses: actions/checkout@v4

      - name: Determine Image Tags
        id: meta
        run: |
          RAW_TAG="${{ github.ref_name }}"
          if [ -z "$RAW_TAG" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ github.event.inputs.version_tag }}"
          fi
          # Strip leading v if needed for semantic label
          VERSION="${RAW_TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "raw_tag=$RAW_TAG" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push ${{ matrix.variant }} Image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: plugin_qgis
          file: plugin_qgis/docker/Dockerfile.${{ matrix.variant }}
          push: true
          tags: |
            ghcr.io/anovvy/palmai-core:${{ steps.meta.outputs.raw_tag }}-${{ matrix.variant }}
            ghcr.io/anovvy/palmai-core:${{ matrix.variant }}
          labels: |
            org.opencontainers.image.title=PalmAI Inference Engine (${{ matrix.variant }})
            org.opencontainers.image.description=Decoupled deep learning inference container for PalmAI QGIS Plugin
            org.opencontainers.image.url=https://github.com/Anovvy/PalmAI_Plugin
            org.opencontainers.image.source=https://github.com/Anovvy/PalmAI_Plugin
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Log Image Digest & Provenance
        run: |
          echo "### Image Published: ${{ matrix.variant }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Primary Tag:** \`ghcr.io/anovvy/palmai-core:${{ steps.meta.outputs.raw_tag }}-${{ matrix.variant }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Compatibility Tag:** \`ghcr.io/anovvy/palmai-core:${{ matrix.variant }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Digest:** \`${{ steps.docker_build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
