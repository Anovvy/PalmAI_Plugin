name: Build PalmAI inference images

on:
  push:
    branches: [main, docker-integration]
    paths:
      - "plugin_qgis/palmai_core/**"
      - "plugin_qgis/docker/**"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [cpu, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: plugin_qgis
          file: plugin_qgis/docker/Dockerfile.${{ matrix.variant }}
          push: true
          tags: ghcr.io/anovvy/palmai-core:${{ matrix.variant }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
