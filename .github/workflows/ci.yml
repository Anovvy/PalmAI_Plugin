name: PalmAI CI Quality Gates

on:
  push:
    branches: [master, docker-integration]
    paths:
      - "plugin_qgis/**"
      - "tests/**"
      - ".github/workflows/**"
      - "scripts/**"
      - "pyproject.toml"
      - "requirements-dev.txt"
  pull_request:
    branches: [master, docker-integration]
    paths:
      - "plugin_qgis/**"
      - "tests/**"
      - ".github/workflows/**"
      - "scripts/**"
      - "pyproject.toml"
      - "requirements-dev.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-metadata:
    name: Lint & Metadata Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Lint & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Run Ruff Linter
        run: |
          ruff check plugin_qgis/backends/ plugin_qgis/palmai_core/ scripts/ tests/

      - name: Validate Plugin Metadata
        run: |
          pytest -v tests/test_plugin_metadata.py

  unit-and-synthetic-gis:
    name: Core, Backend & Synthetic Geospatial Tests
    runs-on: ${{ matrix.os }}
    needs: [lint-and-metadata]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Geospatial & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest Suite
        run: |
          python -m pytest -v --tb=short tests/

  docker-cpu-smoke:
    name: Docker CPU Smoke & Worker Check
    runs-on: ubuntu-latest
    needs: [lint-and-metadata]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local CPU Image
        uses: docker/build-push-action@v6
        with:
          context: plugin_qgis
          file: plugin_qgis/docker/Dockerfile.cpu
          load: true
          tags: palmai-core:ci-test
          cache-from: type=gha,scope=cpu
          cache-to: type=gha,mode=max,scope=cpu

      - name: Run Worker Environment Check in Container
        run: |
          docker run --rm palmai-core:ci-test python -m palmai_core.worker --check

  package-artifact:
    name: Package Plugin ZIP Artifact
    runs-on: ubuntu-latest
    needs: [lint-and-metadata]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Package Plugin
        run: |
          python scripts/package_plugin.py --dist-dir dist

      - name: Upload Plugin ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PalmAI-v2.0.0-zip
          path: dist/PalmAI.zip
          retention-days: 14
